name: Construire les recettes
on:
  push:
    branches: [claude/modernise-ui-fr]  # TEMPORAIRE : génère les données de la PR, retiré avant fusion
  workflow_dispatch:
    inputs:
      min_rating:
        description: "Note minimale"
        default: "4.5"
      min_reviews:
        description: "Nombre d'avis minimum"
        default: "10"
      recipenlg_dataset:
        description: "Dataset Kaggle RecipeNLG pour récupérer les unités (vide pour ignorer)"
        default: "paultimothymooney/recipenlg"
      recipenlg_file:
        description: "(Optionnel) Nom du fichier CSV dans ce dataset"
        default: "RecipeNLG_dataset.csv"
      translate_budget:
        description: "Minutes max de traduction automatique (reprend au lancement suivant)"
        default: "300"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow six "kaggle>=1.8" ctranslate2 sentencepiece sacremoses transformers torch --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: ~/.cache/chavitera-mt
          key: opus-mt-en-fr-ct2-v1
      - name: Télécharger Food.com depuis Kaggle
        env:
          T: ${{ secrets.KAGGLE_API_TOKEN }}
          U: ${{ secrets.KAGGLE_USERNAME }}
          K: ${{ secrets.KAGGLE_KEY }}
        run: |
          [ -n "$T" ] && export KAGGLE_API_TOKEN="$T"
          [ -n "$U" ] && export KAGGLE_USERNAME="$U"
          [ -n "$K" ] && export KAGGLE_KEY="$K"
          mkdir -p raw
          kaggle datasets download -d irkaal/foodcom-recipes-and-reviews -f recipes.parquet -p raw
          cd raw && for z in *.zip; do [ -f "$z" ] && unzip -o "$z" && rm "$z"; done; ls -la
      - name: (Optionnel) Télécharger RecipeNLG
        continue-on-error: true
        env:
          T: ${{ secrets.KAGGLE_API_TOKEN }}
          U: ${{ secrets.KAGGLE_USERNAME }}
          K: ${{ secrets.KAGGLE_KEY }}
        run: |
          [ -n "$T" ] && export KAGGLE_API_TOKEN="$T"
          [ -n "$U" ] && export KAGGLE_USERNAME="$U"
          [ -n "$K" ] && export KAGGLE_KEY="$K"
          DS="${{ github.event_name == 'push' && 'paultimothymooney/recipenlg' || inputs.recipenlg_dataset }}"
          [ -z "$DS" ] && exit 0
          kaggle datasets list -s recipenlg | head -20 || true
          kaggle datasets files "$DS" || true
          kaggle datasets download -d "$DS" -f "${{ inputs.recipenlg_file || 'RecipeNLG_dataset.csv' }}" -p raw
          cd raw && for z in *.zip; do [ -f "$z" ] && unzip -o "$z" && rm "$z"; done; ls -la
      - name: Construire la base
        run: |
          EXTRA=""
          F="raw/${{ inputs.recipenlg_file || 'RecipeNLG_dataset.csv' }}"
          [ -f "$F" ] && EXTRA="--recipenlg $F"
          python tools/build_data.py raw/recipes.parquet --min-rating ${{ inputs.min_rating || '4.5' }} --min-reviews ${{ inputs.min_reviews || '10' }} $EXTRA
      - name: Traduire en français (automatique, mis en cache)
        run: python tools/translate_fr.py --budget-min ${{ inputs.translate_budget || '300' }}
      - name: Reconstruire avec les traductions
        run: |
          EXTRA=""
          F="raw/${{ inputs.recipenlg_file || 'RecipeNLG_dataset.csv' }}"
          [ -f "$F" ] && EXTRA="--recipenlg $F"
          python tools/build_data.py raw/recipes.parquet --min-rating ${{ inputs.min_rating || '4.5' }} --min-reviews ${{ inputs.min_reviews || '10' }} $EXTRA
      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tools/top300_to_translate.json tools/unknown_ingredients.txt tools/translations_fr.json tools/ingredients_fr_mt.json
          git commit -m "Données recettes mises à jour" || echo "Rien à commiter"
          git push
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages.yml
