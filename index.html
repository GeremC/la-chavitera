<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>La Chavitera</title>
  <meta name="theme-color" content="#FDF3E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171311" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Choisissez vos recettes, la liste de courses se fait toute seule.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="La Chavitera">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"><h1 id="title">Choisir les menus</h1><div id="topActions"></div></header>
    <main id="view"></main>
    <nav class="tabs" id="tabs">
      <button data-tab="menu" class="on"><span class="ti" data-ic="plan"></span>Choisir</button>
      <button data-tab="shop"><span class="ti" data-ic="cart"></span>Courses<b class="badge" id="shopBadge" hidden></b></button>
      <button data-tab="cook"><span class="ti" data-ic="chef"></span>Cuisiner<b class="badge" id="cookBadge" hidden></b></button>
      <button data-tab="history"><span class="ti" data-ic="archive"></span>Archives</button>
      <button data-tab="profile"><span class="ti" data-ic="user"></span>Profil</button>
    </nav>
  </div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="timers" class="tdock" hidden></div>
  <div id="timersTop" class="tdock top" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
